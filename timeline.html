<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="https://use.typekit.net/fxp0wzs.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      overscroll-behavior-x: contain;
    }

    /* Scroll container  */
    #tl-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: #f5f5f5;
      scroll-behavior: smooth;
      position: relative;
      overscroll-behavior-x: contain;
    }

    #tl-wrap::-webkit-scrollbar {
      display: none;
    }

    .tl-date {
      font-family: 'JetBrains Mono';
      font-size: 10px;
      fill: #333333;
      text-transform: uppercase;
    }

    .tl-event {
      font-family: 'Neue Haas Unica W1G';
      font-size: 12px;
      fill: #333333;
    }

    .tl-axis-label {
      font-family: 'Neue Haas Unica W1G';
      font-size: 12px;
      fill: #333333;
    }

    #tl-legend {
      position: absolute;
      bottom: 16px;
      left: 24px;
    }
  </style>
</head>

<body>

  <div id="tl-wrap">
    <svg id="tl-svg"></svg>
    <div id="tl-legend"></div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  
<script>

    // Data

    const DATA = [
      { dateLabel: '2015', date: '2017-01-01', label: 'Arconic sell Reynobond PE for use on Grenfell Tower', category: 'corporate' },
      // { dateLabel: '2013-2017', date: '2017-01-01', label: 'Pre-fire warnings from Grenfell Action Group', category: 'grenfell' },
      { dateLabel: '14 June 2017', date: '2017-06-14', label: 'Grenfell Tower fire', category: 'anniversary', url: 'https://www.theguardian.com/uk-news/2017/jun/14/what-happened-at-grenfell-tower-london-fire-visual-guide' },
      { dateLabel: '14 June 2017', date: '2017-06-14', label: 'Grenfell Inquiry ordered', category: 'grenfell' },
      { dateLabel: '11 August 2017', date: '2017-08-11', label: "Arconic's shareholders sue in the Western District Court of Pennsylvania (Howard v. Arconic)", category: 'shareholders', url: 'https://www.theguardian.com/uk-news/2021/jul/18/us-judge-allows-lawsuit-against-grenfell-tower-cladding-firm' },
      { dateLabel: 'May 2018', date: '2018-05-01', label: 'Government pledge £400 million in the Social Sector ACM Cladding Remediation Fund', category: 'remediation', url: 'https://www.london.gov.uk/programmes-strategies/housing-and-land/housing-and-land-funding-programmes/cladding-remediation-funding-programmes' },
      { dateLabel: '14 June 2018', date: '2018-06-14', label: 'First anniversary of the fire', category: 'anniversary' },
      { dateLabel: 'May 2019', date: '2019-05-01', label: 'Government announce additional £200 million in Private Sector ACM Cladding Remediation Fund', category: 'remediation', url: 'https://www.london.gov.uk/programmes-strategies/housing-and-land/housing-and-land-funding-programmes/cladding-remediation-funding-programmes' },
      { dateLabel: '21 June 2019', date: '2019-06-21', label: 'Case dismissed on the grounds of insufficient evidence', category: 'shareholders', url: 'https://www.skadden.com/-/media/files/publications/2019/09/inside-the-courts/howard_v_arconic_inc.pdf' },
      { dateLabel: '14 June 2019', date: '2019-06-14', label: 'Second anniversary of the fire', category: 'anniversary' },
      { dateLabel: '19 June 2019', date: '2019-06-19', label: 'Product liability case brought by 250 plaintiffs filed in the Eastern District Court of Pennsylvania (Behrens v. Arconic)', category: 'litigation', url: 'https://www.courtlistener.com/docket/15811610/behrens-v-arconic-inc/' },
      { dateLabel: '30 October 2019', date: '2019-10-30', label: 'Inquiry Phase 1 published', category: 'grenfell', url: 'https://webarchive.nationalarchives.gov.uk/ukgwa/20250319155650/https://www.grenfelltowerinquiry.org.uk/phase-1-report' },
      { dateLabel: 'April 2020', date: '2020-04-01', label: 'Arconic splits into Arconic and Howmet Aerospace', category: 'corporate', url: 'https://www.howmet.com/press-release/2020-02-06/arconic-inc-board-of-directors-approves-separation-of-company/' },
      { dateLabel: 'March 2020', date: '2020-03-01', label: 'Abdel-Kader litigation: Claims first filed in the High Court of England and Wales', category: 'litigation', labelSide: 'below' },
      { dateLabel: '14 June 2020', date: '2020-06-14', label: 'Third anniversary of the fire', category: 'anniversary' },
      { dateLabel: '6 August 2020', date: '2020-08-06', label: 'Arconic produces document of insurance policies (Behrens v Arconic)', category: 'litigation' },
      { dateLabel: '16 September 2020', date: '2020-09-16', label: 'Behrens v. Arconic case dismissed on the grounds of "forum non conveniens"', category: 'litigation', labelSide: 'below', url: 'https://www.4pumpcourt.com/grenfell-and-the-stretch-to-pennyslvania-for-punitive-damages-2/' },
      { dateLabel: '14 June 2021', date: '2021-06-14', label: 'Fourth anniversary of the fire', category: 'anniversary' },
      { dateLabel: '23 June 2021', date: '2021-06-23', label: 'Case allowed to proceed after Second Amended Complaint', category: 'shareholders', url: 'https://law.justia.com/cases/federal/district-courts/pennsylvania/pawdce/2:2017cv01057/240358/132/' },
      { dateLabel: '14 June 2022', date: '2022-06-14', label: 'Fifth anniversary of the fire', category: 'anniversary' },
      { dateLabel: '8 July 2022', date: '2022-07-08', label: 'Behrens v. Arconic appeal dismissed', category: 'litigation', url: 'https://law.justia.com/cases/federal/appellate-courts/ca3/20-3606/20-3606-2022-07-08.html' },
      { dateLabel: '28 July 2022', date: '2022-07-28', label: 'Abdel-Kader litigation judgement', category: 'litigation', labelSide: 'below', url: 'https://www.judiciary.uk/judgments/abdel-kader-and-ors-v-royal-borough-of-kensington-and-chelsea-and-ors/' },
      { dateLabel: '2 May 2023', date: '2023-05-02', label: 'Preliminary approval of the settlement', category: 'shareholders', url: 'https://pomlaw.com/news/pomerantz-achieves-74-million-settlement-for-arconic-investors/' },
      { dateLabel: 'May 2023', date: '2023-05-01', label: 'Civil settlement agreed for £150 million', category: 'litigation', url: 'https://www.bbc.co.uk/news/uk-england-london-65458973' },
      { dateLabel: '14 June 2023', date: '2023-06-14', label: 'Sixth anniversary of the fire', category: 'anniversary' },
      { dateLabel: '18 August 2023', date: '2023-08-18', label: 'Apollo acquires Arconic for $5.2 billion', category: 'corporate', url: 'https://www.reuters.com/markets/deals/apollo-acquire-aerospace-industry-supplier-arconic-52-bln-deal-2023-05-04/' },
      { dateLabel: '14 June 2024', date: '2024-06-14', label: 'Seventh anniversary of the fire', category: 'anniversary' },
      { dateLabel: '4 September 2024', date: '2024-09-04', label: 'Inquiry Phase 2 published', category: 'grenfell', url: 'https://webarchive.nationalarchives.gov.uk/ukgwa/20250320032754/https://www.grenfelltowerinquiry.org.uk/phase-2-report' },
      { dateLabel: '26 February 2025', date: '2025-02-26', label: 'Government accepts Inquiry findings in full', category: 'grenfell', url: 'https://www.gov.uk/government/news/government-responds-in-full-to-grenfell-tower-inquiry-setting-out-tough-new-reforms-to-fix-building-safety-and-strengthen-accountability' },
      { dateLabel: '14 June 2025', date: '2025-06-14', label: 'Eighth anniversary of the fire', category: 'anniversary' },
      { dateLabel: '13 May 2026', date: '2026-05-13', label: "King's Speech introduces Remediation Bill aimed to accelerate removal of unsafe cladding on residential buildings", category: 'remediation', url: 'https://www.gov.uk/government/speeches/the-kings-speech-2026' },
      { dateLabel: '14 June 2026', date: '2026-06-14', label: 'Ninth anniversary of the fire', category: 'anniversary' },
      { dateLabel: '30 September 2026', date: '2026-09-30', label: 'Metropolitan Police to submit evidence files to the Crown Prosecution Service', category: 'grenfell', url: 'https://www.bbc.co.uk/news/articles/c1e24vxyqnwo' },
    ];


    // Colours

    const C = {
      anniversary: "#0C425B",
      corporate: '#9ca4fc',
      shareholders: '#5C328A',
      grenfell: '#00C0A3',
      remediation: '#A0ECD0',
      litigation: '#777777',
      axis: '#333333',
      gridline: '#d3d3d3',
      eventText: '#333333',
    };


    // Dimensions

    const HEIGHT = 700;
    const MARGIN = { top: 24, right: 24, bottom: 24, left: 24 };
    const PX_PER_YEAR = 420;
    // const LAYER_GAP = 120;
    const DOT_R = 8;
    const LABEL_OFFSET_X = -4;
    const LABEL_OFFSET_Y = 24;
    const FS = { event: 12, axis: 12, layer: 12 };
    const PATH_OPACITY = 1;
    const CONNECTOR_LENGTH = 8;
    const LABEL_MAX_WIDTH = 200;
    const LINE_HEIGHT = FS.event * 1.3;
    const LABEL_FONT = `${FS.event}px Neue Haas Unica W1G`;
    const AXIS_TICK = 8;
    const LEGEND_ITEM_HEIGHT = 20;
    const LEGEND_DOT_R = 5;

    // Layers

    const LAYERS = [
      { id: 'corporate', color: C.corporate, axisLine: false, legendLabel: 'Arconic restructuring' },
      { id: 'shareholders', color: C.shareholders, axisLine: false, legendLabel: 'Shareholder action — Howard v. Arconic' },
      { id: 'anniversary', color: C.anniversary, axisLine: true, showInLegend: false },
      { id: 'grenfell', color: C.grenfell, axisLine: false, legendLabel: 'Grenfell Tower Inquiry' },
      { id: 'litigation', color: C.litigation, axisLine: false, legendLabel: 'Civil actions — Behrens v. Arconic and the Abdel-Kader litigation' },
      { id: 'remediation', color: C.remediation, axisLine: false, legendLabel: 'Cladding remediation' },
    ];

    // Old vertical order from centre
    // const centerY = HEIGHT / 2;
    // const Y_OFFSETS = [-2, -1, 0, 1, 2, 3];
    // LAYERS.forEach((l, i) => l.y = centerY + Y_OFFSETS[i] * LAYER_GAP);

    const fullHeight = HEIGHT - MARGIN.top - MARGIN.bottom;
    const TOP_OFFSET = 64;
    LAYERS.forEach((l, i) => {
      l.y = MARGIN.top + TOP_OFFSET + (i / (LAYERS.length - 1)) * (fullHeight - TOP_OFFSET);
    });


    // Timeline date range
    const T0 = new Date('2017-01-01');
    const T1 = new Date('2027-05-01');

    const innerW = Math.round((T1 - T0) / (365.25 * 864e5) * PX_PER_YEAR);
    const totalW = innerW + MARGIN.left + MARGIN.right;

    const x = d3.scaleTime().domain([T0, T1]).range([MARGIN.left, MARGIN.left + innerW]);

    DATA.forEach(d => d._date = new Date(d.date));

    // Text-wrapping helper
    function wrapText(text, maxWidth, font) {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = font;
      const words = text.split(' ');
      const lines = [];
      let line = '';
      words.forEach(word => {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    }


    // Render

    const svg = d3.select('#tl-svg')
      .attr('width', totalW)
      .attr('height', HEIGHT)
      .style('display', 'block');

    // Anniversary gridlines
    const years = d3.timeYear.range(T0, T1).map(d => {
      d.setMonth(5);
      d.setDate(14);
      return d;
    });
    svg.append('g')
      .selectAll('line').data(years).join('line')
      .attr('x1', d => x(d)).attr('x2', d => x(d))
      .attr('y1', MARGIN.top).attr('y2', HEIGHT - MARGIN.bottom)
      .attr('stroke', C.gridline).attr('stroke-width', 1);

    // Layers
    LAYERS.forEach(layer => {
      const evts = DATA
        .filter(d => d.category === layer.id)
        .sort((a, b) => a._date - b._date);

      if (!evts.length) return;

      const g = svg.append('g');

      // Draw anniversary axis and ticks
      if (layer.axisLine) {
        g.append('line')
          .attr('x1', MARGIN.left)
          .attr('x2', MARGIN.left + innerW)
          .attr('y1', layer.y).attr('y2', layer.y)
          .attr('stroke', layer.color)
          .attr('stroke-width', 1.5)
          .attr('opacity', PATH_OPACITY);
        [MARGIN.left, MARGIN.left + innerW].forEach(tx => {
          g.append('line')
            .attr('x1', tx).attr('x2', tx)
            .attr('y1', layer.y - AXIS_TICK)
            .attr('y2', layer.y + AXIS_TICK)
            .attr('stroke', layer.color)
            .attr('stroke-width', 1.5);
        });
      }

      else {
        g.append('line')
          .attr('x1', x(evts[0]._date))
          .attr('x2', x(evts[evts.length - 1]._date))
          .attr('y1', layer.y).attr('y2', layer.y)
          .attr('stroke', layer.color)
          .attr('stroke-width', 1.5)
          .attr('opacity', PATH_OPACITY);
      }

      // Dots
      const dots = g.selectAll('a.dot-link').data(evts).join('a')
        .attr('href', d => d.url || null)
        .attr('target', '_blank')
        .style('cursor', d => d.url ? 'pointer' : 'default');

      dots.append('circle')
        .attr('cx', d => x(d._date))
        .attr('cy', layer.y)
        .attr('r', DOT_R)
        .attr('fill', layer.color);

      // Label connectors
      g.selectAll('line.connector').data(evts).join('line')
        .attr('x1', d => x(d._date))
        .attr('x2', d => x(d._date))
        .attr('y1', d => {
          const dir = d.labelSide === 'below' ? 1 : -1;
          return layer.y + dir * DOT_R;
        })
        .attr('y2', d => {
          const dir = d.labelSide === 'below' ? 1 : -1;
          return layer.y + dir * (DOT_R + CONNECTOR_LENGTH);
        })
        .attr('stroke', layer.color)
        .attr('stroke-width', 1.5);

      // Labels
      evts.forEach(d => {
        d._lines = wrapText(d.label, LABEL_MAX_WIDTH, LABEL_FONT);
      });
      g.selectAll('a.label-link').data(evts).join('a')
        .attr('href', d => d.url || null)
        .attr('target', '_blank')
        .style('cursor', d => d.url ? 'pointer' : 'default')
        .append('text')
        .attr('transform', d => {
          const dir = d.labelSide === 'below' ? 1 : -1;
          const capHeight = FS.event * 0.72;
          const extraLines = d._lines.length - 1;
          const ty = dir === -1
            ? layer.y - (DOT_R + CONNECTOR_LENGTH + LABEL_OFFSET_Y) - (extraLines * LINE_HEIGHT)
            : layer.y + (DOT_R + CONNECTOR_LENGTH + LABEL_OFFSET_Y) - capHeight;
          return `translate(${x(d._date) - DOT_R}, ${ty})`;
        })
        .attr('text-anchor', 'start')
        .each(function (d) {
          const el = d3.select(this);
          el.append('tspan')
            .attr('x', 0).attr('dy', 0)
            .attr('class', 'tl-date')
            .text(d.dateLabel);
          d._lines.forEach(line => {
            el.append('tspan')
              .attr('x', 0).attr('dy', `${LINE_HEIGHT}px`)
              .attr('class', 'tl-event')
              .text(line);
          });
        });
    });

    // Legend
    const legend = d3.select('#tl-legend');

    LAYERS.filter(l => l.showInLegend !== false).forEach(layer => {
      const item = legend.append('div')
        .style('display', 'flex')
        .style('align-items', 'center')
        .style('margin-bottom', '8px');

      item.append('div')
        .style('width', `${LEGEND_DOT_R * 2}px`)
        .style('height', `${LEGEND_DOT_R * 2}px`)
        .style('border-radius', '50%')
        .style('background', layer.color)
        .style('flex-shrink', '0');

      item.append('span')
        .style('margin-left', '8px')
        .attr('class', 'tl-date')
        .text(layer.legendLabel);
    });

  </script>

</body>

</html>
