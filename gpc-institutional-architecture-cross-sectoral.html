      font-size: 10px;

    .tooltip {
      position: absolute;

      opacity: 0;
      transition: opacity 0.15s;

    .tooltip strong {
      display: block;
      margin-bottom: 4px;
    }

    }
  </style>
</head>

      // Departments (DBT and Joint departments appear twice)
      { id: "CO", name: "Cabinet Office", abbr: "CO", type: "department", x: 505.6, y: 208.5 },
      { id: "HO", name: "Home Office", abbr: "HO", type: "department", x: 685.6, y: 388.5 },
      { id: "MHCLG", name: "Ministry of Housing, Communities and Local Government", abbr: "MHCLG", type: "department", x: 504.7, y: 567.6 },
      { id: "HMT", name: "HM Treasury", abbr: "HMT", type: "department", x: 504.7, y: 888.5 },
      { id: "DBT1", name: "Department for Business & Trade", abbr: "DBT", type: "department", x: 325.6, y: 748.5 },
      { id: "DSIT", name: "Department for Science, Innovation and Technology", abbr: "DSIT", type: "department", x: 505.6, y: 1288.5 },
      { id: "DESNZ", name: "Department for Energy Security and Net Zero", abbr: "DESNZ", type: "department", x: 147.7, y: 1469.1 },
      { id: "Joint2", name: "Joint departments", abbr: "Joint", type: "department", x: 775.8, y: 1554.1 },
      { id: "SVCS", name: "Civil Service", abbr: "CS", type: "department", x: 775.8, y: 1828.5 },
      { id: "DWP", name: "Department for Work and Pensions", abbr: "DWP", type: "department", x: 1044.6, y: 1468.5 },
      { id: "DBT2", name: "Department for Business & Trade", abbr: "DBT", type: "department", x: 865.6, y: 1020.8 },
      { id: "Joint", name: "Joint departments", abbr: "Joint", type: "department", x: 325.6, y: 388.5 },
    ];

    // Edges 
    const edges = [
      { source: "N10", target: "CO", function: "Executive" },
      { source: "GCA", target: "CO", function: "Executive" },
      { source: "UKSA", target: "CO", function: "Executive" },
      { source: "NSI", target: "CO", function: "Executive" },
      { source: "MI5", target: "HO", function: "Executive" },
      { source: "NISTA", target: "Joint", function: "Executive" },
      { source: "NISTA", target: "Joint", function: "Advisory" },
      { source: "PI", target: "MHCLG", function: "Executive" },
      { source: "HMLR", target: "MHCLG", function: "Executive" },
      { source: "UKGI", target: "HMT", function: "Executive" },
      { source: "UKGI", target: "HMT", function: "Advisory" },
      { source: "TCE", target: "HMT", function: "Executive" },
      { source: "NWF", target: "HMT", function: "Financing" },
      { source: "BBB", target: "DBT1", function: "Financing" },
      { source: "CS", target: "DBT2", function: "Advisory" },
      { source: "CAT", target: "DBT2", function: "Judicial" },
      { source: "SAU", target: "DBT2", function: "Advisory" },
      { source: "CMA", target: "DBT2", function: "Regulatory" },
      { source: "NSSIF", target: "DSIT", function: "Financing" },
      { source: "UKRI", target: "DSIT", function: "Executive" },
      { source: "UKRI", target: "DSIT", function: "Financing" },
      { source: "ARIA", target: "DSIT", function: "Executive" },
      { source: "ARIA", target: "DSIT", function: "Financing" },
      { source: "IPO", target: "DSIT", function: "Regulatory" },
      { source: "RIO", target: "DSIT", function: "Regulatory" },
      { source: "GOTT", target: "DSIT", function: "Executive" },
      { source: "MO", target: "DSIT", function: "Advisory" },
      { source: "GOS", target: "DSIT", function: "Advisory" },
      { source: "BOT", target: "DBT2", function: "Advisory" },
      { source: "ETF", target: "Joint2", function: "Advisory" },
      { source: "GES", target: "SVCS", function: "Advisory" },
      { source: "CCC", target: "DESNZ", function: "Advisory" },
      { source: "OfI", target: "Joint2", function: "Advisory" },
      { source: "ISAC", target: "Joint2", function: "Advisory" },
      { source: "OIT", target: "SVCS", function: "Advisory" },
      { source: "GAF", target: "SVCS", function: "Advisory" },
      { source: "SE", target: "DWP", function: "Executive" },
    ];

    // Visual mappings

    const institutionTypes = [
      { label: "Executive body", color: "#FFA69E" },
      { label: "Intelligence service", color: "#F19953" },
      { label: "Procurement agency", color: "#0C425B" },
      { label: "Statistical authority", color: "#9CA4FC" },
      { label: "State holding agency", color: "#EDF67D" },
      { label: "Publicly owned company", color: "#6F7D34" },
      { label: "Advisory body", color: "#00C0A3" },
      { label: "Regulatory body", color: "#453643" },
      { label: "Judicial body", color: "#A0ECD0" },
    ];

    const institutionTypeColour = Object.fromEntries(
      institutionTypes.map(d => [d.label, d.color])
    );

    const edgeStyle = {
      "Financing": { stroke: "#333", dasharray: null, width: 2 },
      "Advisory": { stroke: "#333", dasharray: "8,4", width: 2 },
      "Regulatory": { stroke: "#333", dasharray: "8,6,2,6", width: 2 },
      "Executive": { stroke: "#333", dasharray: "1,8", width: 3 },
      "Judicial": { stroke: "#333", dasharray: "12,6", width: 2 },
    };

    const edgeTypes = Object.entries(edgeStyle).map(([label, s]) => ({ label, dasharray: s.dasharray }));

    function nodeRadius(d) { return d.type === "department" ? 50 : 30; }
    function nodeColour(d) {
      if (d.type === "department") return "#333";
      return institutionTypeColour[d.institutionType] ?? "#7a8399";
    }

    // Hull helper 


    const expandHull = (points, padding) => {
      const hull = d3.polygonHull(points);
      if (!hull) return null;
      const cx = d3.mean(hull, p => p[0]);
      const cy = d3.mean(hull, p => p[1]);
      const expanded = hull.map(p => {
        const dx = p[0] - cx, dy = p[1] - cy;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        return [p[0] + dx / len * padding, p[1] + dy / len * padding];
      });
      return "M" + expanded.map(p => p.join(",")).join("L") + "Z";
    };

    function hullPath(points, padding) {
      if (!points.length) return null;
      if (points.length === 1) {
        const [x, y] = points[0];
        const r = padding * 1;
        const synthetic = [0, 1, 2, 3].map(i => {
          const angle = (i / 4) * 2 * Math.PI + Math.PI / 4;
          return [x + r * Math.cos(angle), y + r * Math.sin(angle)];
        });
        return expandHull(synthetic, padding);
      }
      if (points.length === 2) {
        const dx = points[1][0] - points[0][0], dy = points[1][1] - points[0][1];
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const ux = -dy / len * padding, uy = dx / len * padding;
        return `M${points[0][0] + ux},${points[0][1] + uy}L${points[1][0] + ux},${points[1][1] + uy}L${points[1][0] - ux},${points[1][1] - uy}L${points[0][0] - ux},${points[0][1] - uy}Z`;
      }
      const hull = d3.polygonHull(points);
      if (!hull) return null;
      const cx = d3.mean(hull, p => p[0]), cy = d3.mean(hull, p => p[1]);
      return "M" + hull.map(p => {
        const dx = p[0] - cx, dy = p[1] - cy;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        return [p[0] + dx / len * padding, p[1] + dy / len * padding].join(",");
      }).join("L") + "Z";
    }

    // Tooltip 

    const tooltip = document.getElementById("tooltip");

    // SVG 
    const pad = 80;
    const minX = d3.min(nodes, d => d.x) - pad;
    const minY = d3.min(nodes, d => d.y) - pad;
    const maxX = d3.max(nodes, d => d.x) + pad;
    const maxY = d3.max(nodes, d => d.y) + pad;
    const vbW = maxX - minX;
    const vbH = maxY - minY;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `${minX} ${minY} ${vbW} ${vbH}`)
      .attr("preserveAspectRatio", "xMidYMid meet")
      .style("width", "100%");

    document.getElementById("chart").style.aspectRatio = `${vbW} / ${vbH}`;

    const gRoot = svg.append("g");

    svg.call(d3.zoom()
      .scaleExtent([0.3, 6])
      .on("zoom", e => gRoot.attr("transform", e.transform))
    );

    const clusterLayer = gRoot.append("g");
    const edgeLayer = gRoot.append("g");
    const nodeLayer = gRoot.append("g");
    const labelLayer = gRoot.append("g");

    // Cluster hulls
    const clusterNames = [...new Set(nodes.filter(n => n.cluster).map(n => n.cluster))];
    const instNodes = nodes.filter(n => n.type === "institution");

    clusterLayer.selectAll("path.hull")
      .data(clusterNames)
      .join("path")
      .attr("class", "hull")
      .attr("d", name =>
        hullPath(instNodes.filter(n => n.cluster === name).map(n => [n.x, n.y]), 40) ?? ""
      )
      .attr("fill", "#F1EBE4")
      .attr("fill-opacity", 1)

    // Cluster labels
    clusterLayer.selectAll("text.cluster-label")
      .data(clusterNames)
      .join("text")
      .attr("class", "cluster-label")
      .each(function (name) {
        const members = instNodes.filter(n => n.cluster === name);
        const x = d3.min(members, n => n.x) - 48;
        const y = d3.min(members, n => n.y) - 64;
        d3.select(this).attr("x", x).attr("y", y);
      })
      .attr("fill", "#555")
      .attr("font-family", "'JetBrains Mono', monospace")
      .attr("font-size", "20px")
      .attr("font-weight", "300")
      .attr("letter-spacing", "0.06em")
      .attr("pointer-events", "none")
      .each(function (name) {
        const el = d3.select(this);
        const words = name.split(" ");
        const maxChars = 18;
        const lines = [];
        let current = "";
        for (const word of words) {
          const candidate = current ? current + " " + word : word;
          if (candidate.length > maxChars && current) { lines.push(current); current = word; }
          else current = candidate;
        }
        if (current) lines.push(current);
        lines.forEach((line, i) => {
          el.append("tspan")
            .attr("x", el.attr("x"))
            .attr("dy", i === 0 ? "0" : "1.2em")
            .text(line);
        });
      });

    // Edges

    const nodeById = new Map(nodes.map(n => [n.id, n]));

    // Offset parallel edges for doubles
    const edgeKey = e => [e.source, e.target].sort().join("__");
    const edgeCounts = new Map();
    edges.forEach(e => {
      const k = edgeKey(e);
      edgeCounts.set(k, (edgeCounts.get(k) ?? 0) + 1);
    });
    const edgeIndex = new Map();
    edges.forEach(e => {
      const k = edgeKey(e);
      edgeIndex.set(e, edgeIndex.size);
    });

    // Track index within each pair for offset
    const pairCounter = new Map();
    edges.forEach(e => {
      const k = edgeKey(e);
      const i = pairCounter.get(k) ?? 0;
      e._pairIndex = i;
      e._pairTotal = edgeCounts.get(k);
      pairCounter.set(k, i + 1);
    });

    edgeLayer.selectAll("line.edge")
      .data(edges)
      .join("line")
      .attr("class", "edge")
      .attr("x1", e => {
        const n = nodeById.get(e.source);
        if (e._pairTotal > 1) {
          const tgt = nodeById.get(e.target);
          const dx = tgt.y - n.y, dy = n.x - tgt.x;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const offset = (e._pairIndex - (e._pairTotal - 1) / 2) * 5;
          return n.x + dx / len * offset;
        }
        return n.x;
      })
      .attr("y1", e => {
        const n = nodeById.get(e.source);
        if (e._pairTotal > 1) {
          const tgt = nodeById.get(e.target);
          const dx = tgt.y - n.y, dy = n.x - tgt.x;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const offset = (e._pairIndex - (e._pairTotal - 1) / 2) * 5;
          return n.y + dy / len * offset;
        }
        return n.y;
      })
      .attr("x2", e => {
        const n = nodeById.get(e.target);
        if (e._pairTotal > 1) {
          const src = nodeById.get(e.source);
          const dx = n.y - src.y, dy = src.x - n.x;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const offset = (e._pairIndex - (e._pairTotal - 1) / 2) * 5;
          return n.x + dx / len * offset;
        }
        return n.x;
      })
      .attr("y2", e => {
        const n = nodeById.get(e.target);
        if (e._pairTotal > 1) {
          const src = nodeById.get(e.source);
          const dx = n.y - src.y, dy = src.x - n.x;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const offset = (e._pairIndex - (e._pairTotal - 1) / 2) * 5;
          return n.y + dy / len * offset;
        }
        return n.y;
      })
      .attr("stroke", e => edgeStyle[e.function]?.stroke ?? "#333")
      .attr("stroke-width", e => edgeStyle[e.function]?.width ?? 1.5)
      .attr("stroke-dasharray", e => edgeStyle[e.function]?.dasharray ?? null)
      .attr("stroke-linecap", e => e.function === "Executive" ? "round" : "butt")
      .attr("opacity", 0.85);

    // Nodes

    const nodeSel = nodeLayer.selectAll("g.node")
      .data(nodes)
      .join("g")
      .attr("class", "node")
      .attr("transform", d => `translate(${d.x},${d.y})`)
      .style("cursor", "pointer")
      .on("mouseover", (event, d) => {
        tooltip.style.opacity = "1";
        tooltip.innerHTML = d.type === "department"
          ? `<strong>${d.name}</strong><div class="tt-row">Government department</div>`
          : `<strong>${d.name}</strong>
           <div class="tt-row">Type: ${d.institutionType}</div>
           <div class="tt-row">Department: ${d.institutionType}</div>
           <div class="tt-row">Cluster: ${d.cluster}</div>
           <div class="tt-row">Legal: ${d.legal ?? "—"}</div>`;
      })
      .on("mousemove", event => {
        tooltip.style.left = (event.pageX + 14) + "px";
        tooltip.style.top = (event.pageY - 10) + "px";
      })
      .on("mouseout", () => { tooltip.style.opacity = "0"; });

    // Department
    nodeSel.filter(d => d.type === "department")
      .append("rect")
      .attr("width", d => nodeRadius(d) * 1.8)
      .attr("height", d => nodeRadius(d) * 1.8)
      .attr("x", d => -nodeRadius(d) * 0.9)
      .attr("y", d => -nodeRadius(d) * 0.9)
      .attr("transform", "rotate(45)")
      .attr("fill", nodeColour);

    // Institution 
    nodeSel.filter(d => d.type === "institution")
      .append("circle")
      .attr("r", nodeRadius)
      .attr("fill", nodeColour);

    // Labels
    labelLayer.selectAll("text.node-label")
      .data(nodes)
      .join("text")
      .attr("class", "node-label")
      .attr("x", d => d.x)
      .attr("y", d => d.y)
      .text(d => d.abbr)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "central")
      .attr("fill", "#fff")
      .attr("font-family", "'JetBrains Mono', monospace")
      .attr("font-size", d => d.type === "department" ? "18px" : "14px")
      .attr("font-weight", d => d.type === "department" ? "500" : "400")
      .attr("pointer-events", "none");

    // Legend 

    (function drawLegend() {
      const el = document.getElementById("legend");
      const section = (title, rows) =>
        `<div style="margin-bottom:10px;flex:0 0 auto">
        <div style="font-size:8px;font-weight:500;letter-spacing:0.1em;color:#777;margin-bottom:4px">${title.toUpperCase()}</div>
        ${rows.join("")}
      </div>`;
      const circleRow = (color, label) =>
        `<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${color}"/></svg>
        <span>${label}</span>
      </div>`;
      const diamondRow = (color, label) =>
        `<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <svg width="14" height="14"><rect x="3" y="3" width="8" height="8" transform="rotate(45,7,7)" fill="${color}"/></svg>
        <span>${label}</span>
      </div>`;
      const edgeRow = (dasharray, label) =>
        `<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <svg width="20" height="14"><line x1="0" y1="7" x2="20" y2="7" stroke="#333" stroke-width="2" ${dasharray ? `stroke-dasharray="${dasharray}"` : ""}></line></svg>
        <span>${label}</span>
      </div>`;
      el.innerHTML = [
        section("Node type", [
          diamondRow("#333", "Government department"),
          circleRow("#333", "Institution"),
        ]),
        section("Institution type", institutionTypes.map(d => circleRow(d.color, d.label))),
        section("Function", edgeTypes.map(d => edgeRow(d.dasharray, d.label))),
      ].join("");
    })();

    window.addEventListener('wheel', e => {
      window.parent?.scrollBy({ top: e.deltaY, left: e.deltaX, behavior: 'auto' });
    }, { passive: true });

  </script>
</body>

</html>
